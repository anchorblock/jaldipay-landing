name: Deploy Main Site (Client)

on:
  push:
    branches:
      - client
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: client

      - name: Copy app files to EC2 client directory
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: ${{ secrets.EC2_TARGET_DIR }}/client
          EXCLUDE: ".git, .github, node_modules, .next"

      - name: Deploy main site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.EC2_TARGET_DIR }}

            # Stop old containers and remove orphans (cleans up previous single-app setup)
            docker compose down --remove-orphans || true

            # Copy shared config files from client to root
            cp client/docker-compose.yml ./docker-compose.yml
            cp client/Caddyfile ./Caddyfile

            # Create .env file
            cat > .env << EOF
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            EOF

            # Build and start main app + caddy
            docker compose up -d --build app-main caddy

            # Cleanup old images
            docker image prune -f
